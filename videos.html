    .nav-inner {

    .nav {

      gap: 20px;

      font-weight: bold;

    .nav a:hover,
    .nav .active {
      color: #c9aa6a;
    }

    .page-header {
      padding: 95px 25px 60px;
      text-align: center;
      background:

      font-size: clamp(38px, 7vw, 65px);

      text-align: center;
      font-size: clamp(25px, 5vw, 40px);
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .video-subtitle {
      text-align: center;
      color: #c9aa6a;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #9f844f;
      background: #000;
      box-shadow: 0 15px 45px rgba(0,0,0,.5);
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .youtube-button {
      display: block;
      width: min(100%, 400px);
      margin: 25px auto 0;
      padding: 17px 20px;

      border: 1px solid #9f844f;

      color: #fff;
      text-decoration: none;
      text-align: center;
      letter-spacing: 2px;

    footer {

      border-top: 1px solid #34302a;
      background: #050708;
      color: #9e927e;
      letter-spacing: 2px;

        padding: 20px;

        gap: 14px;
